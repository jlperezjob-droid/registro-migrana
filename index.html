<!doctype html>
<html lang="es" data-theme="oscuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro de migraña</title>
<meta name="description" content="Registro de medicación para la migraña: cuántas tomas quedan y cuándo se puede tomar la siguiente.">
<meta name="theme-color" content="#0f1418">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Migraña">
<style>
  :root{
    --bg:#0f1418; --card:#171e24; --card2:#212a32; --line:#2a343d;
    --text:#e4e8eb; --muted:#8e9aa5; --accent:#6cc4b8; --accent-ink:#0b1a18;
    --ok:#6cc58a; --warn:#e3b14f; --bad:#e2706b; --radius:18px;
    color-scheme:dark;
  }
  html[data-theme="claro"]{
    --bg:#f3f0eb; --card:#fffdf9; --card2:#ece7df; --line:#e0dad0;
    --text:#1f2428; --muted:#646d76; --accent:#2c8a7e; --accent-ink:#ffffff;
    --ok:#2e8b57; --warn:#a8720c; --bad:#c2473f;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  body{min-height:100vh;padding:env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom))}
  button,input,select{font:inherit;color:inherit}
  .top{max-width:560px;margin:0 auto;padding:18px 20px 4px}
  .top h1{margin:0;font-size:28px;letter-spacing:-.01em}
  .top p{margin:2px 0 0;color:var(--muted);font-size:15px}
  main{max-width:560px;margin:0 auto;padding:6px 16px 24px}
  h2{font-size:19px;margin:0}
  h3{font-size:20px;margin:0 0 12px}
  .muted{color:var(--muted)}
  .section-title{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 4px 8px;font-weight:600}

  /* Barra inferior */
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;background:var(--card);
    border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tabs button{flex:1;max-width:190px;background:none;border:0;color:var(--muted);font-size:13px;padding:9px 0 10px;
    display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
  .tabs button[aria-current="page"]{color:var(--accent)}
  .tabs svg{width:25px;height:25px}

  /* Tarjetas */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0}
  .summary{display:flex;align-items:center;gap:12px;padding:12px 16px}
  .summary b{font-size:24px}
  .summary small{display:block;color:var(--muted);font-size:13px}
  .med{border-left:5px solid var(--c)}
  .med-head{display:flex;align-items:center;gap:8px}
  .med-head h2{flex:1;min-width:0;overflow-wrap:anywhere}
  .dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
  .pill{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
  .pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
  .pill.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
  .pill.bad{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}
  .big{display:flex;align-items:baseline;gap:8px;margin:10px 0 8px}
  .big .num{font-size:46px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .big .of{color:var(--muted);font-size:16px}
  .stock-low .num{color:var(--warn)} .stock-zero .num{color:var(--bad)}
  .segs{display:flex;gap:4px;margin:4px 0 8px}
  .segs i{flex:1;height:12px;border-radius:4px;background:var(--card2)}
  .segs i.on{background:var(--ok)}
  .stock-low .segs i.on,.stock-low .bar i{background:var(--warn)}
  .bar{height:12px;border-radius:6px;background:var(--card2);overflow:hidden;margin:4px 0 8px}
  .bar i{display:block;height:100%;background:var(--ok);border-radius:6px}
  .meta{margin:0;color:var(--muted);font-size:15px}
  .status{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--card2);font-size:16px}
  .status.bad{background:color-mix(in srgb,var(--bad) 14%,var(--card));}
  .status.warn{background:color-mix(in srgb,var(--warn) 14%,var(--card));}
  .status small{display:block;color:var(--muted);font-size:14px;margin-top:2px}
  .strip{display:flex;gap:2px;margin:14px 0 2px}
  .strip i{flex:1;height:18px;border-radius:3px;background:var(--card2)}
  .strip i.c1{background:color-mix(in srgb,var(--c) 70%,transparent)}
  .strip i.c2{background:var(--c);box-shadow:inset 0 -5px 0 rgba(0,0,0,.35)}
  .strip i.today{outline:2px solid var(--text);outline-offset:1px}
  .strip i.future{opacity:.35}
  .strip-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}
  .actions{display:flex;gap:8px;margin-top:14px}
  .actions .btn{font-size:16px;white-space:nowrap;padding:14px 12px}
  .actions .btn.ghost{flex:none}
  .last{margin:10px 0 0;color:var(--muted);font-size:14px}

  /* Botones */
  .btn{border:0;border-radius:14px;padding:14px 16px;font-weight:600;cursor:pointer;min-height:52px}
  .btn.primary{background:var(--accent);color:var(--accent-ink);flex:1}
  .btn.soft{background:var(--card2);color:var(--text);flex:1}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  .btn.danger{background:var(--bad);color:#fff;flex:1}
  .btn.link{background:none;color:var(--bad);padding:10px 0;min-height:0;width:100%;margin-top:6px}
  .btn.small{min-height:40px;padding:8px 14px;font-size:15px}
  .btn:active{transform:scale(.98)}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .stack>*+*{margin-top:8px}
  .btn.block{width:100%;display:block}

  /* Lista de medicamentos en ajustes */
  .item{display:flex;align-items:center;gap:12px}
  .item .txt{flex:1;min-width:0}
  .item .txt b{display:block;overflow-wrap:anywhere}
  .item .txt span{color:var(--muted);font-size:14px}

  /* Calendario */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .cal-head b{font-size:18px}
  .icon-btn{background:var(--card2);border:0;border-radius:12px;width:44px;height:44px;font-size:22px;cursor:pointer;color:var(--text)}
  .icon-btn:disabled{opacity:.3}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal .wd{text-align:center;font-size:12px;color:var(--muted);padding:2px 0}
  .cal button{aspect-ratio:1/1.05;border:0;border-radius:10px;background:var(--card2);color:var(--text);padding:4px 0 0;
    display:flex;flex-direction:column;align-items:center;gap:3px;font-size:15px;cursor:pointer}
  .cal button.empty{visibility:hidden}
  .cal button.today{outline:2px solid var(--accent)}
  .cal button.sel{background:var(--accent);color:var(--accent-ink)}
  .cal button:disabled{opacity:.35}
  .cal .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:90%}
  .cal .dots i{width:7px;height:7px;border-radius:50%;background:var(--c)}
  .cal button.sel .dots i{outline:1px solid var(--accent-ink)}
  .dose{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;width:100%;
    background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:var(--text)}
  .dose:first-of-type{border-top:0}
  .dose .time{font-weight:700;font-variant-numeric:tabular-nums;width:52px}
  .dose .txt{flex:1;min-width:0}
  .dose .txt span{display:block;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
  .chev{color:var(--muted)}

  /* Hoja modal */
  dialog{border:0;padding:0;background:transparent;color:var(--text);max-width:560px;width:100%;margin:auto auto 0;max-height:92vh}
  dialog::backdrop{background:rgba(0,0,0,.55)}
  .sheet{background:var(--card);border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));
    max-height:92vh;overflow:auto}
  .sheet:focus{outline:none}
  @media (min-width:600px){ dialog{margin:auto} .sheet{border-radius:22px} }
  .sheet p{margin:0 0 14px}
  label,fieldset{display:block;margin:0 0 14px;border:0;padding:0}
  label>span.lbl,legend{display:block;font-size:14px;color:var(--muted);margin-bottom:5px;padding:0}
  input[type=text],input[type=number],input[type=datetime-local],select{width:100%;background:var(--card2);border:1px solid var(--line);
    border-radius:12px;padding:12px;min-height:48px;font-size:17px}
  .check{display:flex;align-items:center;gap:10px;font-size:17px}
  .check input{width:22px;height:22px;accent-color:var(--accent)}
  .scale{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
  .scale button{border:1px solid var(--line);background:var(--card2);border-radius:9px;min-height:42px;padding:0;cursor:pointer;font-weight:600}
  .scale button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .scale-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:3px}
  .swatches{display:flex;gap:10px;flex-wrap:wrap}
  .swatches label{margin:0}
  .swatches input{position:absolute;opacity:0;pointer-events:none}
  .swatches span{display:block;width:38px;height:38px;border-radius:50%;background:var(--c);border:3px solid transparent;cursor:pointer}
  .swatches input:checked+span{border-color:var(--text)}
  .swatches input:focus-visible+span{outline:2px solid var(--accent)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .hint{font-size:14px;color:var(--muted)}
  .err{color:var(--bad);font-weight:600}
  .sheet-actions{display:flex;gap:8px;margin-top:6px}
  .seg{display:flex;background:var(--card2);border-radius:12px;padding:3px}
  .seg button{flex:1;border:0;background:none;padding:10px;border-radius:10px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.25);font-weight:600}

  /* Aviso */
  #toast{position:fixed;left:12px;right:12px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:20;max-width:536px;margin:0 auto;
    background:var(--text);color:var(--bg);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;
    transform:translateY(20px);opacity:0;pointer-events:none;transition:.2s}
  #toast.show{transform:none;opacity:1;pointer-events:auto}
  #toast span{flex:1;font-size:15px}
  #toast button{background:none;border:0;color:var(--bg);font-weight:700;text-decoration:underline;padding:6px 4px;cursor:pointer}
  .empty-state{text-align:center;padding:30px 16px}
  .empty-state p{color:var(--muted)}
</style>
</head>
<body>
<header class="top"><h1 id="title">Hoy</h1><p id="subtitle"></p></header>
<main id="view"></main>

<nav class="tabs" aria-label="Secciones">
  <button data-tab="hoy" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><g transform="rotate(-45 12 12)"><rect x="2.5" y="8" width="19" height="8" rx="4"/><path d="M12 8v8"/></g></svg>
    Hoy
  </button>
  <button data-tab="historial">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    Historial
  </button>
  <button data-tab="ajustes">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
    Ajustes
  </button>
</nav>

<dialog id="sheet"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept=".json,application/json,text/plain" hidden>

<script src="logic.js"></script>
<script>
(function () {
  'use strict';
  var R = window.RegMed;
  var KEY = 'regmed.v1';
  var APP_VERSION = '1.0.0';
  var COLORS = ['#6cc4b8', '#e3b14f', '#9b8cf0', '#e2706b', '#6aa8e8', '#d98ad0', '#9bc46c'];

  var view = document.getElementById('view');
  var sheet = document.getElementById('sheet');
  var sheetHandlers = {};

  /* ---------- Datos ---------- */
  function uid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  }
  function seed() {
    return {
      version: 1,
      // Configuración inicial. Se puede cambiar desde Ajustes.
      meds: [
        { id: uid(), name: 'Zolmitriptán 5 mg', color: COLORS[0], limit: { count: 10, unit: 'tomas', window: 'movil' },
          maxPer24h: 2, minHours: 2, archived: false },
        { id: uid(), name: 'Antalgin (naproxeno)', color: COLORS[1], limit: { count: 15, unit: 'dias', window: 'movil' },
          maxPer24h: null, minHours: null, archived: false },
        { id: uid(), name: 'Metoclopramida (10 ml)', color: COLORS[2], limit: null,
          maxPer24h: 3, minHours: 6, archived: false }
      ],
      doses: [],
      settings: { theme: 'oscuro', lastBackup: null }
    };
  }
  function isValidState(s) {
    return s && Array.isArray(s.meds) && Array.isArray(s.doses) &&
      s.meds.every(function (m) { return m && m.id && typeof m.name === 'string'; }) &&
      s.doses.every(function (d) { return d && d.id && d.medId && typeof d.t === 'number'; });
  }
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY));
      if (isValidState(s)) { s.settings = s.settings || { theme: 'oscuro', lastBackup: null }; return s; }
    } catch (e) {}
    return null;
  }
  var state = load();
  var firstRun = !state;
  if (!state) state = seed();
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { toast('No se ha podido guardar. Haz una copia de seguridad desde Ajustes.'); }
  }
  if (firstRun) save();

  var ui = { tab: 'hoy', calMonth: R.startOfMonth(Date.now()), selDay: R.startOfDay(Date.now()) };

  function med(id) { return state.meds.find(function (m) { return m.id === id; }); }
  function activeMeds() { return state.meds.filter(function (m) { return !m.archived; }); }

  /* ---------- Formato ---------- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function fmtTime(ms) { return new Date(ms).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }); }
  function fmtDay(ms) { return new Date(ms).toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' }).replace(',', ''); }
  function fmtDayShort(ms) { return new Date(ms).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }); }
  function fmtDayLong(ms) { return new Date(ms).toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' }); }
  function relDay(ms, now) {
    var d = R.daysBetween(now, ms);
    if (d === 0) return 'hoy';
    if (d === -1) return 'ayer';
    if (d === 1) return 'mañana';
    return 'el ' + fmtDay(ms);
  }
  function fmtDuration(ms) {
    var m = Math.max(1, Math.ceil(ms / 60000));
    if (m < 60) return m + ' min';
    var h = Math.floor(m / 60), mm = m % 60;
    if (h < 48) return h + ' h' + (mm ? ' ' + mm + ' min' : '');
    return Math.floor(ms / R.DAY) + ' días';
  }
  /** "el jue 3 dic (dentro de 10 días)" o "hoy a las 22:15 (faltan 1 h 49 min)" */
  function whenText(at, now) {
    if (R.startOfDay(at) === at) {
      var d = R.daysBetween(now, at);
      if (d === 1) return '<b>mañana</b> (' + fmtDay(at) + ')';
      return 'el <b>' + fmtDay(at) + '</b> (dentro de ' + d + ' días)';
    }
    return '<b>' + relDay(at, now) + ' a las ' + fmtTime(at) + '</b> (faltan ' + fmtDuration(at - now) + ')';
  }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
  function toLocalInput(ms) {
    var d = new Date(ms), p = R.pad;
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function limitText(m) {
    var parts = [];
    if (m.limit) {
      parts.push('Máx. ' + m.limit.count + ' ' + (m.limit.unit === 'dias' ? 'días con toma' : 'tomas') +
        (m.limit.window === 'natural' ? ' por mes natural' : ' en 30 días'));
    } else parts.push('Sin límite mensual');
    if (m.maxPer24h) parts.push('máx. ' + m.maxPer24h + ' en 24 h');
    if (m.minHours) parts.push(String(m.minHours).replace('.', ',') + ' h entre tomas');
    return parts.join(' · ');
  }

  /* ---------- Cabecera y pestañas ---------- */
  function setHeader(title, sub) {
    document.getElementById('title').textContent = title;
    document.getElementById('subtitle').textContent = sub || '';
  }
  function render() {
    document.querySelectorAll('.tabs button').forEach(function (b) {
      if (b.dataset.tab === ui.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    if (ui.tab === 'hoy') renderHoy();
    else if (ui.tab === 'historial') renderHistorial();
    else renderAjustes();
  }

  /* ---------- HOY ---------- */
  function renderHoy() {
    var now = Date.now();
    setHeader('Hoy', cap(fmtDayLong(now)));
    var meds = activeMeds();
    var h = '';
    var dwm = R.daysWithMedication(state.doses, now);
    h += '<div class="card summary"><b>' + dwm + '</b><div>' + (dwm === 1 ? 'día' : 'días') +
         ' con alguna medicación<small>en los últimos 30 días</small></div></div>';

    if (!meds.length) {
      h += '<div class="card empty-state"><p>Todavía no hay medicamentos.</p>' +
           '<button class="btn primary" data-act="add-med">Añadir medicamento</button></div>';
    }
    meds.forEach(function (m) { h += medCard(m, R.computeStatus(m, state.doses, now), now); });

    var lb = state.settings.lastBackup;
    if (state.doses.length >= 5 && (!lb || now - lb > 30 * R.DAY)) {
      h += '<div class="card"><p class="meta" style="margin-bottom:10px">Los datos solo están en este móvil. ' +
           (lb ? 'La última copia es del ' + fmtDayShort(lb) + '.' : 'Aún no has guardado ninguna copia.') + '</p>' +
           '<button class="btn soft block" data-act="export-json">Guardar copia de seguridad</button></div>';
    }
    view.innerHTML = h;
  }

  function medCard(m, st, now) {
    var L = st.limit;
    var pill = { ok: ['ok', 'Disponible'], pocas: ['warn', 'Quedan pocas'], espera: ['warn', 'Espera'],
                 bloqueado: ['bad', 'Límite alcanzado'] }[st.level];
    var stock = '';
    if (L) stock = L.remaining === 0 ? ' stock-zero' : (L.remaining <= Math.max(1, Math.ceil(L.count * 0.2)) ? ' stock-low' : '');
    var h = '<article class="card med lvl-' + st.level + stock + '" style="--c:' + esc(m.color) + '">';
    h += '<div class="med-head"><span class="dot"></span><h2>' + esc(m.name) + '</h2><span class="pill ' + pill[0] + '">' + pill[1] + '</span></div>';

    if (L) {
      var dias = L.unit === 'dias';
      var unitWord = dias ? (L.count === 1 ? 'día' : 'días') : (L.count === 1 ? 'toma' : 'tomas');
      h += '<div class="big"><span class="num">' + L.remaining + '</span><span class="of">de ' + L.count + ' ' + unitWord +
           ' disponibles' + (L.window === 'natural' ? ' este mes' : '') + '</span></div>';
      if (L.count <= 31) {
        h += '<div class="segs" aria-hidden="true">';
        for (var i = 0; i < L.count; i++) h += '<i class="' + (i < L.remaining ? 'on' : '') + '"></i>';
        h += '</div>';
      } else {
        h += '<div class="bar" aria-hidden="true"><i style="width:' + (L.remaining / L.count * 100) + '%"></i></div>';
      }
      var meta = (dias ? plural(L.used, 'día con toma', 'días con toma') : plural(L.used, 'toma', 'tomas')) +
                 (L.window === 'natural' ? ' este mes' : ' en los últimos 30 días');
      if (L.over) meta += ' · <b>' + L.over + ' por encima del límite</b>';
      else if (L.nextRelease && L.remaining > 0) {
        meta += L.window === 'natural'
          ? ' · se reinicia el ' + fmtDayShort(L.nextRelease)
          : ' · recupera ' + L.releaseCount + ' el ' + fmtDay(L.nextRelease);
      }
      h += '<p class="meta">' + meta + '</p>';
    } else {
      var start30 = R.startOfDay(R.addDays(now, -(R.WINDOW_DAYS - 1)));
      var n30 = state.doses.filter(function (d) { return d.medId === m.id && d.t >= start30 && d.t <= now; }).length;
      h += '<div class="big"><span class="num">' + n30 + '</span><span class="of">' + (n30 === 1 ? 'toma' : 'tomas') +
           ' en los últimos 30 días</span></div><p class="meta">' + esc(limitText(m)) + '</p>';
    }

    // Tira de días del periodo
    var days = R.periodDays(m.limit, now);
    var counts = R.countsByDay(state.doses, m.id);
    var today = R.startOfDay(now);
    h += '<div class="strip" aria-hidden="true">';
    days.forEach(function (d) {
      var c = counts[d] || 0;
      h += '<i class="' + (c >= 2 ? 'c2' : c === 1 ? 'c1' : '') + (d === today ? ' today' : '') + (d > today ? ' future' : '') + '"></i>';
    });
    h += '</div><div class="strip-labels"><span>' + fmtDayShort(days[0]) + '</span><span>' +
         (days[days.length - 1] === today ? 'hoy' : fmtDayShort(days[days.length - 1])) + '</span></div>';

    // Estado
    if (!st.canTake) {
      var reasons = st.blocks.map(function (b) {
        if (b.type === 'limite') return 'Ha llegado al límite (' + L.count + ' ' + (L.unit === 'dias' ? 'días' : 'tomas') +
          (L.window === 'natural' ? ' este mes' : ' en 30 días') + ').';
        if (b.type === '24h') return 'Máximo ' + plural(m.maxPer24h, 'toma', 'tomas') + ' en 24 h.';
        return 'Deben pasar ' + String(m.minHours).replace('.', ',') + ' h entre tomas.';
      });
      h += '<div class="status ' + (st.level === 'bloqueado' ? 'bad' : 'warn') + '">Según la pauta, la próxima sería ' + whenText(st.nextAt, now) +
           '<small>' + reasons.join(' ') + '</small></div>';
    } else if (L && L.unit === 'dias' && L.todayCounted) {
      h += '<div class="status">Hoy ya cuenta como día de toma: otra toma hoy no gasta un día más.</div>';
    }

    // Acciones
    h += '<div class="actions"><button class="btn ' + (st.canTake ? 'primary' : 'soft') + '" data-act="take" data-id="' + m.id + '">' +
         (st.canTake ? 'Registrar toma' : 'Registrar igualmente') + '</button>' +
         '<button class="btn ghost" data-act="take-other" data-id="' + m.id + '">Otra hora</button></div>';

    if (st.last) {
      h += '<p class="last">Última toma: ' + relDay(st.last.t, now) + ' a las ' + fmtTime(st.last.t) +
           ' · hace ' + fmtDuration(now - st.last.t) + '</p>';
    }
    return h + '</article>';
  }

  /* ---------- Registrar ---------- */
  function quickTake(id) {
    var m = med(id), now = Date.now();
    var st = R.computeStatus(m, state.doses, now);
    if (!st.canTake) {
      confirmSheet('¿Registrar igualmente?',
        'Según la pauta, ' + esc(m.name) + ' no tocaría hasta ' + whenText(st.nextAt, now) +
        '. Si ya la has tomado, regístrala: que la cuenta sea real también sirve para el médico.',
        'Registrar toma', function () { addDose(id, Date.now()); });
      return;
    }
    addDose(id, now);
  }
  function addDose(medId, t, pain, note) {
    var d = { id: uid(), medId: medId, t: t, pain: pain || null, note: note || '' };
    state.doses.push(d);
    save(); render();
    toast(med(medId).name + ' registrada a las ' + fmtTime(t), [
      { label: 'Detalles', fn: function () { doseSheet(d.id); } },
      { label: 'Deshacer', fn: function () { removeDose(d.id); toast('Toma eliminada'); } }
    ]);
  }
  function removeDose(id) {
    state.doses = state.doses.filter(function (d) { return d.id !== id; });
    save(); render();
  }

  /* ---------- Hojas (diálogos) ---------- */
  function openSheet(html, handlers, onMount) {
    sheetHandlers = handlers || {};
    sheet.innerHTML = '<div class="sheet">' + html + '</div>';
    if (!sheet.open) sheet.showModal();
    // Que no salte el teclado del móvil al abrir: el foco va a la hoja, no al primer campo
    var root = sheet.querySelector('.sheet');
    root.setAttribute('tabindex', '-1');
    root.focus({ preventScroll: true });
    if (onMount) onMount(root);
  }
  function closeSheet() { if (sheet.open) sheet.close(); }
  sheet.addEventListener('click', function (e) {
    if (e.target === sheet) { closeSheet(); return; }
    var b = e.target.closest('[data-s]');
    if (!b) return;
    var fn = sheetHandlers[b.dataset.s];
    if (fn) fn(b); else if (b.dataset.s === 'cancel') closeSheet();
  });
  sheet.addEventListener('cancel', function () { sheetHandlers = {}; });

  function confirmSheet(title, bodyHtml, okLabel, onOk, danger) {
    openSheet('<h3>' + title + '</h3><p>' + bodyHtml + '</p><div class="sheet-actions">' +
      '<button type="button" class="btn ' + (danger ? 'danger' : 'primary') + '" data-s="ok">' + okLabel + '</button>' +
      '<button type="button" class="btn ghost" data-s="cancel">Cancelar</button></div>',
      { ok: function () { closeSheet(); onOk(); } });
  }

  function doseSheet(doseId, preset) {
    var d = doseId ? state.doses.find(function (x) { return x.id === doseId; }) : null;
    if (doseId && !d) return;
    preset = preset || {};
    var medId = d ? d.medId : (preset.medId || (activeMeds()[0] || {}).id);
    if (!medId) { toast('Primero añade un medicamento en Ajustes'); return; }
    var t = d ? d.t : (preset.t || Date.now());
    var pain = d ? d.pain : null;
    var opts = state.meds.filter(function (m) { return !m.archived || m.id === medId; }).map(function (m) {
      return '<option value="' + m.id + '"' + (m.id === medId ? ' selected' : '') + '>' + esc(m.name) + '</option>';
    }).join('');
    var scale = '';
    for (var i = 1; i <= 10; i++) scale += '<button type="button" data-pain="' + i + '" aria-pressed="' + (pain === i) + '">' + i + '</button>';

    openSheet(
      '<h3>' + (d ? 'Editar toma' : 'Registrar toma') + '</h3>' +
      '<label><span class="lbl">Medicamento</span><select name="med">' + opts + '</select></label>' +
      '<label><span class="lbl">Fecha y hora</span><input type="datetime-local" name="t" value="' + toLocalInput(t) + '" max="' + toLocalInput(Date.now()) + '"></label>' +
      '<fieldset><legend>Intensidad del dolor <span class="muted">(opcional)</span></legend><div class="scale">' + scale + '</div>' +
      '<div class="scale-labels"><span>leve</span><span>insoportable</span></div></fieldset>' +
      '<label><span class="lbl">Nota <span class="muted">(opcional)</span></span><input type="text" name="note" maxlength="140" value="' + esc(d ? d.note : '') + '" placeholder="Ej.: con aura, hizo efecto a la hora"></label>' +
      '<p class="err" hidden></p>' +
      '<div class="sheet-actions"><button type="button" class="btn primary" data-s="save">Guardar</button>' +
      '<button type="button" class="btn ghost" data-s="cancel">Cancelar</button></div>' +
      (d ? '<button type="button" class="btn link" data-s="delete">Eliminar esta toma</button>' : ''),
      {
        save: function () {
          var root = sheet.querySelector('.sheet');
          var tv = new Date(root.querySelector('[name=t]').value).getTime();
          var err = root.querySelector('.err');
          if (isNaN(tv)) { err.textContent = 'Indica la fecha y la hora.'; err.hidden = false; return; }
          if (tv > Date.now() + 60000) { err.textContent = 'La hora no puede ser futura.'; err.hidden = false; return; }
          var sel = root.querySelector('[data-pain][aria-pressed="true"]');
          var p = sel ? +sel.dataset.pain : null;
          var note = root.querySelector('[name=note]').value.trim();
          var mid = root.querySelector('[name=med]').value;
          closeSheet();
          if (d) { d.medId = mid; d.t = tv; d.pain = p; d.note = note; save(); render(); toast('Toma actualizada'); }
          else addDose(mid, tv, p, note);
        },
        delete: function () {
          confirmSheet('¿Eliminar esta toma?', esc(med(d.medId) ? med(d.medId).name : '') + ' · ' + relDay(d.t, Date.now()) + ' a las ' + fmtTime(d.t),
            'Eliminar', function () { removeDose(d.id); toast('Toma eliminada'); }, true);
        }
      },
      function (root) {
        root.querySelector('.scale').addEventListener('click', function (e) {
          var b = e.target.closest('[data-pain]'); if (!b) return;
          var was = b.getAttribute('aria-pressed') === 'true';
          root.querySelectorAll('[data-pain]').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
          b.setAttribute('aria-pressed', String(!was));
        });
      });
  }

  function medSheet(medId) {
    var m = medId ? med(medId) : null;
    var used = state.meds.map(function (x) { return x.color; });
    var color = m ? m.color : (COLORS.find(function (c) { return used.indexOf(c) === -1; }) || COLORS[0]);
    var lim = m ? m.limit : null;
    var hasDoses = m && state.doses.some(function (d) { return d.medId === m.id; });
    var sw = COLORS.map(function (c) {
      return '<label style="--c:' + c + '"><input type="radio" name="color" value="' + c + '"' + (c === color ? ' checked' : '') +
             ' aria-label="Color ' + c + '"><span></span></label>';
    }).join('');

    openSheet(
      '<h3>' + (m ? 'Editar medicamento' : 'Nuevo medicamento') + '</h3>' +
      '<label><span class="lbl">Nombre</span><input type="text" name="name" maxlength="40" value="' + esc(m ? m.name : '') + '" placeholder="Ej.: Rizatriptán 10 mg"></label>' +
      '<fieldset><legend>Color</legend><div class="swatches">' + sw + '</div></fieldset>' +
      '<label class="check"><input type="checkbox" name="hasLimit"' + (m ? (lim ? ' checked' : '') : '') + '> Tiene un límite al mes</label>' +
      '<div class="limit-fields"' + ((m ? lim : false) ? '' : ' hidden') + '>' +
        '<label><span class="lbl">Máximo</span><input type="number" name="count" min="1" max="99" inputmode="numeric" value="' + (lim ? lim.count : 10) + '"></label>' +
        '<label><span class="lbl">Qué se cuenta</span><select name="unit">' +
          '<option value="tomas"' + (!lim || lim.unit === 'tomas' ? ' selected' : '') + '>Cada toma (cada pastilla cuenta)</option>' +
          '<option value="dias"' + (lim && lim.unit === 'dias' ? ' selected' : '') + '>Días con toma (varias el mismo día = 1)</option></select></label>' +
        '<label><span class="lbl">Periodo</span><select name="window">' +
          '<option value="movil"' + (!lim || lim.window === 'movil' ? ' selected' : '') + '>Últimos 30 días (móvil)</option>' +
          '<option value="natural"' + (lim && lim.window === 'natural' ? ' selected' : '') + '>Mes natural (se reinicia el día 1)</option></select></label>' +
      '</div>' +
      '<div class="grid2">' +
        '<label><span class="lbl">Máx. tomas en 24 h <span class="muted">(opcional)</span></span><input type="number" name="max24" min="1" max="20" inputmode="numeric" value="' + (m && m.maxPer24h ? m.maxPer24h : '') + '"></label>' +
        '<label><span class="lbl">Horas entre tomas <span class="muted">(opcional)</span></span><input type="number" name="minH" min="0.5" max="72" step="0.5" inputmode="decimal" value="' + (m && m.minHours ? m.minHours : '') + '"></label>' +
      '</div>' +
      '<p class="hint">Pon los límites que le haya indicado su médico o el prospecto. La app solo lleva la cuenta.</p>' +
      '<p class="err" hidden></p>' +
      '<div class="sheet-actions"><button type="button" class="btn primary" data-s="save">Guardar</button>' +
      '<button type="button" class="btn ghost" data-s="cancel">Cancelar</button></div>' +
      (m ? '<button type="button" class="btn link" data-s="remove">' + (hasDoses ? 'Archivar (se conserva el historial)' : 'Eliminar medicamento') + '</button>' : ''),
      {
        save: function () {
          var root = sheet.querySelector('.sheet');
          var err = root.querySelector('.err');
          var name = root.querySelector('[name=name]').value.trim();
          if (!name) { err.textContent = 'Pon un nombre.'; err.hidden = false; return; }
          var hasLimit = root.querySelector('[name=hasLimit]').checked;
          var count = parseInt(root.querySelector('[name=count]').value, 10);
          if (hasLimit && !(count >= 1)) { err.textContent = 'El máximo debe ser 1 o más.'; err.hidden = false; return; }
          var max24 = parseInt(root.querySelector('[name=max24]').value, 10);
          var minH = parseFloat(String(root.querySelector('[name=minH]').value).replace(',', '.'));
          var data = {
            name: name,
            color: (root.querySelector('[name=color]:checked') || {}).value || color,
            limit: hasLimit ? { count: count, unit: root.querySelector('[name=unit]').value, window: root.querySelector('[name=window]').value } : null,
            maxPer24h: max24 > 0 ? max24 : null,
            minHours: minH > 0 ? minH : null
          };
          if (m) Object.assign(m, data);
          else state.meds.push(Object.assign({ id: uid(), archived: false }, data));
          save(); closeSheet(); render(); toast('Medicamento guardado');
        },
        remove: function () {
          if (hasDoses) {
            confirmSheet('¿Archivar ' + esc(m.name) + '?', 'Dejará de aparecer en Hoy, pero sus tomas seguirán en el historial. Puedes recuperarlo desde Ajustes.',
              'Archivar', function () { m.archived = true; save(); render(); });
          } else {
            confirmSheet('¿Eliminar ' + esc(m.name) + '?', 'No tiene tomas registradas.', 'Eliminar', function () {
              state.meds = state.meds.filter(function (x) { return x.id !== m.id; }); save(); render();
            }, true);
          }
        }
      },
      function (root) {
        var cb = root.querySelector('[name=hasLimit]');
        cb.addEventListener('change', function () { root.querySelector('.limit-fields').hidden = !cb.checked; });
        if (!m) root.querySelector('[name=name]').focus();
      });
  }

  /* ---------- HISTORIAL ---------- */
  function renderHistorial() {
    var now = Date.now(), today = R.startOfDay(now);
    setHeader('Historial', 'Toca un día para ver o corregir sus tomas');
    var m0 = ui.calMonth, d0 = new Date(m0);
    var y = d0.getFullYear(), mo = d0.getMonth();
    var nDays = new Date(y, mo + 1, 0).getDate();
    var offset = (d0.getDay() + 6) % 7;
    var byDay = {};
    state.doses.forEach(function (d) { var k = R.startOfDay(d.t); (byDay[k] = byDay[k] || []).push(d); });
    var isCurrent = m0 === R.startOfMonth(now);

    var h = '<div class="card"><div class="cal-head">' +
      '<button class="icon-btn" data-act="cal-prev" aria-label="Mes anterior">‹</button><b>' +
      cap(d0.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' })) + '</b>' +
      '<button class="icon-btn" data-act="cal-next" aria-label="Mes siguiente"' + (isCurrent ? ' disabled' : '') + '>›</button></div>' +
      '<div class="cal">' + ['L', 'M', 'X', 'J', 'V', 'S', 'D'].map(function (w) { return '<span class="wd">' + w + '</span>'; }).join('');
    for (var i = 0; i < offset; i++) h += '<button class="empty" tabindex="-1" aria-hidden="true"></button>';
    var monthDoses = 0, monthDays = 0, perMed = {};
    for (var dd = 1; dd <= nDays; dd++) {
      var k = new Date(y, mo, dd).getTime();
      var list = (byDay[k] || []).sort(function (a, b) { return a.t - b.t; });
      if (list.length) { monthDoses += list.length; monthDays++; }
      list.forEach(function (x) { perMed[x.medId] = (perMed[x.medId] || 0) + 1; });
      var dots = list.slice(0, 6).map(function (x) { var mm = med(x.medId); return '<i style="--c:' + esc(mm ? mm.color : '#888') + '"></i>'; }).join('');
      h += '<button data-act="sel-day" data-day="' + k + '" class="' + (k === today ? 'today ' : '') + (k === ui.selDay ? 'sel' : '') + '"' +
           (k > today ? ' disabled' : '') + ' aria-label="' + fmtDayLong(k) + ', ' + plural(list.length, 'toma', 'tomas') + '">' +
           dd + '<span class="dots">' + dots + '</span></button>';
    }
    h += '</div>';
    h += '<p class="meta" style="margin-top:12px">' + plural(monthDoses, 'toma', 'tomas') + ' · ' +
         plural(monthDays, 'día con medicación', 'días con medicación') + ' este mes' +
         (Object.keys(perMed).length > 1 ? '<br>' + Object.keys(perMed).map(function (id) {
           var mm = med(id); return esc(mm ? mm.name : '¿?') + ': ' + perMed[id];
         }).join(' · ') : '') + '</p></div>';

    // Día seleccionado
    var sel = (byDay[ui.selDay] || []).sort(function (a, b) { return a.t - b.t; });
    h += '<div class="section-title">' + cap(fmtDayLong(ui.selDay)) + '</div><div class="card">';
    if (!sel.length) h += '<p class="meta" style="margin-bottom:12px">No hay tomas este día.</p>';
    sel.forEach(function (x) {
      var mm = med(x.medId);
      var extra = [];
      if (x.pain) extra.push('Dolor ' + x.pain + '/10');
      if (x.note) extra.push(esc(x.note));
      h += '<button class="dose" data-act="edit-dose" data-id="' + x.id + '"><span class="time">' + fmtTime(x.t) + '</span>' +
           '<span class="dot" style="--c:' + esc(mm ? mm.color : '#888') + '"></span><span class="txt">' + esc(mm ? mm.name : 'Medicamento eliminado') +
           (extra.length ? '<span>' + extra.join(' · ') + '</span>' : '') + '</span><span class="chev">›</span></button>';
    });
    if (ui.selDay <= today) h += '<button class="btn soft block" style="margin-top:8px" data-act="add-on-day">Añadir toma en este día</button>';
    h += '</div>';
    view.innerHTML = h;
  }

      '<button class="btn ghost block" data-act="import-json">Restaurar una copia</button>' +

      '<p class="hint" style="margin:10px 0 0">El modo oscuro molesta menos a la vista durante una crisis.</p></div>';

    h += '<div class="section-title">Sobre la app</div><div class="card"><p class="meta">Esta app solo lleva la cuenta de lo que se registra. ' +
      'Los límites y la pauta los decide su médico. Versión ' + APP_VERSION + '.</p>' +
      '<button class="btn link" data-act="wipe">Borrar todos los datos</button></div>';

  /* ---------- Exportar / importar ---------- */
  function deliverFile(name, mime, text) {
    var blob = new Blob([text], { type: mime });
    var fallback = function () {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
      return Promise.resolve(true);
    };
    try {
      var file = new File([blob], name, { type: mime });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        return navigator.share({ files: [file], title: name }).then(function () { return true; }, function (e) {
          return e && e.name === 'AbortError' ? false : fallback();
        });
      }
    } catch (e) {}
    return fallback();
  }
  function stamp() { var d = new Date(), p = R.pad; return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); }

  function exportJson() {
    var data = Object.assign({}, state, { exportedAt: new Date().toISOString(), app: 'registro-migrana', appVersion: APP_VERSION });
    deliverFile('registro-migrana-' + stamp() + '.json', 'application/json', JSON.stringify(data, null, 1)).then(function (ok) {
      if (ok) { state.settings.lastBackup = Date.now(); save(); render(); toast('Copia guardada'); }
    });
  }
  function exportCsv() {
    var q = function (s) { s = String(s == null ? '' : s); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    var rows = [['Fecha', 'Hora', 'Medicamento', 'Dolor (1-10)', 'Nota']];
    state.doses.slice().sort(function (a, b) { return a.t - b.t; }).forEach(function (d) {
      var m = med(d.medId);
      rows.push([new Date(d.t).toLocaleDateString('es-ES'), fmtTime(d.t), m ? m.name : '', d.pain || '', d.note || '']);
    });
    var csv = '﻿' + rows.map(function (r) { return r.map(q).join(';'); }).join('\r\n');
    deliverFile('tomas-migrana-' + stamp() + '.csv', 'text/csv', csv);
  }
  var importInput = document.getElementById('importFile');
  importInput.addEventListener('change', function () {
    var f = importInput.files[0]; importInput.value = '';
    if (!f) return;
    f.text().then(function (txt) {
      var s; try { s = JSON.parse(txt); } catch (e) { s = null; }
      if (!isValidState(s)) { toast('Ese archivo no es una copia válida'); return; }
      confirmSheet('¿Restaurar la copia?', 'Se sustituirán los datos actuales (' + plural(state.doses.length, 'toma', 'tomas') +
        ') por los de la copia (' + plural(s.doses.length, 'toma', 'tomas') + ').', 'Restaurar', function () {
          state = { version: 1, meds: s.meds, doses: s.doses, settings: Object.assign({ theme: 'oscuro', lastBackup: null }, s.settings || {}) };
          save(); applyTheme(); render(); toast('Copia restaurada');
        });
    });
  });

  /* ---------- Tema ---------- */
  function applyTheme() {
    var t = state.settings.theme === 'claro' ? 'claro' : 'oscuro';
    document.documentElement.dataset.theme = t;
    document.querySelector('meta[name=theme-color]').setAttribute('content', t === 'claro' ? '#f3f0eb' : '#0f1418');
  }

  /* ---------- Aviso ---------- */
  var toastTimer;
  function toast(msg, actions) {
    var el = document.getElementById('toast');
    actions = actions || [];
    el.innerHTML = '<span>' + esc(msg) + '</span>' + actions.map(function (a, i) { return '<button data-i="' + i + '">' + esc(a.label) + '</button>'; }).join('');
    el.onclick = function (e) {
      var b = e.target.closest('button'); if (!b) return;
      el.classList.remove('show'); actions[+b.dataset.i].fn();
    };
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, actions.length ? 7000 : 3000);
  }

  /* ---------- Eventos ---------- */
  document.querySelector('.tabs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-tab]'); if (!b) return;
    ui.tab = b.dataset.tab;
    if (ui.tab === 'historial') { ui.calMonth = R.startOfMonth(Date.now()); ui.selDay = R.startOfDay(Date.now()); }
    render(); window.scrollTo(0, 0);
  });

  view.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var id = b.dataset.id;
    switch (b.dataset.act) {
      case 'take': quickTake(id); break;
      case 'take-other': doseSheet(null, { medId: id }); break;
      case 'add-med': medSheet(null); break;
      case 'edit-med': medSheet(id); break;
      case 'unarchive': med(id).archived = false; save(); render(); break;
      case 'edit-dose': doseSheet(id); break;
      case 'sel-day': ui.selDay = +b.dataset.day; render(); break;
      case 'add-on-day': {
        var now = new Date(), d = new Date(ui.selDay);
        d.setHours(now.getHours(), now.getMinutes(), 0, 0);
        doseSheet(null, { t: Math.min(d.getTime(), Date.now()) });
        break;
      }
      case 'cal-prev': { var p = new Date(ui.calMonth); ui.calMonth = new Date(p.getFullYear(), p.getMonth() - 1, 1).getTime(); render(); break; }
      case 'cal-next': { var n = new Date(ui.calMonth); ui.calMonth = new Date(n.getFullYear(), n.getMonth() + 1, 1).getTime(); render(); break; }
      case 'export-json': exportJson(); break;
      case 'export-csv': exportCsv(); break;
      case 'import-json': importInput.click(); break;
      case 'theme': state.settings.theme = b.dataset.v; save(); applyTheme(); render(); break;
      case 'wipe':
        confirmSheet('¿Borrar todos los datos?', 'Se eliminarán todos los medicamentos y tomas de este móvil. No se puede deshacer. ' +
          'Si quieres conservarlos, guarda antes una copia.', 'Borrar todo', function () {
            state = seed(); save(); applyTheme(); render(); toast('Datos borrados');
          }, true);
        break;
    }
  });

  // Refrescar cuentas atrás
  setInterval(function () { if (ui.tab === 'hoy' && !sheet.open) renderHoy(); }, 30000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && !sheet.open) render(); });

  applyTheme();
  render();

  // Pedir al navegador que no borre los datos por falta de espacio
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
  // Funcionamiento sin conexión
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
